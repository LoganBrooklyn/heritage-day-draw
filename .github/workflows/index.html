<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Heritage Day Lucky Draw</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:600px;
margin:auto;
padding:30px;
text-align:center;
}

input{
width:90%;
padding:12px;
font-size:18px;
}

button{
background:#00843D;
color:white;
border:none;
padding:12px 20px;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

#result{
margin-top:20px;
font-size:48px;
font-weight:bold;
color:#00843D;
}
</style>
</head>

<body>

<h1>🇿🇦 Heritage Day Lucky Draw</h1>

<p>Enter your name and receive your lucky number.</p>

<input id="name" placeholder="Your Name">

<br><br>

<button onclick="getNumber()">
Get My Number
</button>

<div id="result"></div>

<script>
function getNumber(){

const name =
document.getElementById("name").value.trim();

if(!name){
alert("Please enter your name");
return;
}

const number =
Math.floor(Math.random()*5)+1;

document.getElementById("result").innerHTML =
"🎉 " + number;
}
</script>

</body>
</html>
